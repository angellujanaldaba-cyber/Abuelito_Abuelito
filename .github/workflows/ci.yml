name: Validate application and infrastructure
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile application (no functional tests)
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_TELEMETRY_DISABLED: '1'
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - run: terraform -chdir=deploy/terraform fmt -check
      - run: terraform -chdir=deploy/terraform init -backend=false -input=false
      - run: terraform -chdir=deploy/terraform validate -no-color
      - run: terraform -chdir=deploy/bootstrap fmt -check
      - run: terraform -chdir=deploy/bootstrap init -backend=false -input=false
      - run: terraform -chdir=deploy/bootstrap validate -no-color
      - run: terraform -chdir=deploy/runner fmt -check
      - run: terraform -chdir=deploy/runner init -backend=false -input=false
      - run: terraform -chdir=deploy/runner validate -no-color
      - run: bash -n deploy/runner/bootstrap.sh deploy/runner/register.sh
      - run: python3 -m unittest discover -s deploy/scripts -p 'test_*.py'
