name: Terraform plan or apply reviewed plan
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [plan, plan-destroy, apply-plan]
      plan_run_id:
        description: Run ID del plan que se desea aplicar
        type: string
      confirmation:
        description: Para aplicar escribir APPLY seguido de espacio y el ID del plan
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-dev
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dev-infrastructure
    env:
      AWS_REGION: us-east-1
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS_JSON }}
      TF_VAR_admin_principal_arn: ${{ vars.ADMIN_PRINCIPAL_ARN }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_ci_deploy_role_arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_VAR_db_final_snapshot_identifier: abuelito-eks-final-${{ github.run_id }}
      OPERATION: ${{ inputs.operation }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check role configured
        env:
          ROLE: ${{ vars.AWS_INFRA_ROLE_ARN }}
        run: test -n "$ROLE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '455982475279'
      - run: python3 deploy/scripts/infrastructure.py
