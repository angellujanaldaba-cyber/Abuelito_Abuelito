name: Check AWS OIDC connection
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Comprobar autenticacion sin crear infraestructura
        type: choice
        required: true
        options: [dev-build, dev-infrastructure]
permissions:
  contents: read
  id-token: write
jobs:
  connection:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN || vars.AWS_INFRA_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '455982475279'
      - name: Verify identity
        run: aws sts get-caller-identity
      - name: Verify private backend access
        if: inputs.environment == 'dev-infrastructure'
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix abuelito/dev/ --max-keys 1 --query KeyCount
          aws s3api list-objects-v2 --bucket "$BUCKET" --prefix plans/dev/ --max-keys 1 --query KeyCount
