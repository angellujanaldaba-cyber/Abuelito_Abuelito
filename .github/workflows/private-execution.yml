name: Private database or deployment execution
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  execute:
    if: github.repository == 'angellujanaldaba-cyber/Abuelito_Abuelito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.stage == 'bootstrap' && 'dev-infrastructure' || 'dev-deploy' }}
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STAGE: ${{ inputs.stage }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.stage == 'bootstrap' && vars.AWS_INFRA_ROLE_ARN || vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '455982475279'
      - name: Execute verified bundle in private VPC
        run: python3 deploy/scripts/invoke_codebuild.py "$STAGE" --release "$RUNNER_TEMP/release/release.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.stage }}-result
          path: ${{ inputs.stage }}-result.json
          retention-days: 90
