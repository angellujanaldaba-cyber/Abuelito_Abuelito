name: Build versioned ARM64 images
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed Git commit (40 hexadecimal characters)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: abuelito-build-dev
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'angellujanaldaba-cyber/Abuelito_Abuelito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: dev-build
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      AWS_REGION: us-east-1
      AWS_ACCOUNT: "455982475279"
      REPO: 455982475279.dkr.ecr.us-east-1.amazonaws.com/abuelito-eks-web
      VERSION: ${{ inputs.source_sha }}-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Validate inputs and configuration
        env:
          ROLE: ${{ vars.AWS_BUILD_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ -n "$ROLE" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checked out revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: "455982475279"
      - name: Login to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$AWS_ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build web stage
        id: web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: runner
          platforms: linux/arm64
          push: true
          tags: ${{ env.REPO }}:web-${{ env.VERSION }}
          build-args: |
            APP_VERSION=${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
      - name: Build migrations stage from same source
        id: migrator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: migrator
          platforms: linux/arm64
          push: true
          tags: ${{ env.REPO }}:migrator-${{ env.VERSION }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
      - name: Record immutable release
        env:
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          prisma = {
              str(p): hashlib.sha256(p.read_bytes()).hexdigest()
              for p in sorted(Path('prisma').rglob('*')) if p.is_file()
          }
          release = {
              'source_commit': os.environ['SOURCE_SHA'],
              'architecture': 'linux/arm64',
              'web_image': os.environ['REPO'] + '@' + os.environ['WEB_DIGEST'],
              'migrator_image': os.environ['REPO'] + '@' + os.environ['MIGRATOR_DIGEST'],
              'prisma_files_sha256': prisma,
              'deployment_status': 'not_deployed',
              'functional_acceptance': 'pending_user'
          }
          Path('release.json').write_text(json.dumps(release, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release.json
          retention-days: 90
