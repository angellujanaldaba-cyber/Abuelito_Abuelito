name: Terraform plan or apply reviewed plan
on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      plan_run_id:
        type: string
        default: ''
      confirmation:
        type: string
        default: ''
      expected_plan_type:
        type: string
        default: plan
    outputs:
      alb_dns:
        value: ${{ jobs.infrastructure.outputs.alb_dns }}
  workflow_dispatch:
    inputs:
      expected_plan_type:
        description: Tipo del plan para apply-plan
        type: choice
        default: plan
        options: [plan, plan-destroy]
      operation:
        type: choice
        required: true
        options: [plan, plan-destroy, apply-plan]
      plan_run_id:
        description: Run ID del plan que se desea aplicar
        type: string
      confirmation:
        description: Para aplicar escribir APPLY seguido de espacio y el ID del plan
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: terraform-dev
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.repository == 'angellujanaldaba-cyber/Abuelito_Abuelito' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.operation == 'apply-plan' && 'dev-infrastructure' || 'dev-plan' }}
    outputs:
      alb_dns: ${{ steps.terraform.outputs.alb_dns }}
    env:
      AWS_REGION: us-east-1
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS_JSON }}
      TF_VAR_admin_principal_arn: ${{ vars.ADMIN_PRINCIPAL_ARN }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_db_final_snapshot_identifier: abuelito-eks-final-${{ github.run_id }}
      OPERATION: ${{ inputs.operation }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_PLAN_TYPE: ${{ inputs.expected_plan_type }}
    steps:
      - name: Check role configured
        env:
          ROLE: ${{ inputs.operation == 'apply-plan' && vars.AWS_INFRA_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
        run: test -n "$ROLE"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ inputs.operation == 'apply-plan' && vars.AWS_INFRA_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '455982475279'
      - id: terraform
        run: python3 deploy/scripts/infrastructure.py
